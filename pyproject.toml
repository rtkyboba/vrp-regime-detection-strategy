[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrp-strategy"
version = "0.2.0"
description = "Short-volatility (variance risk premium) research: causal regime models, honest P&L, statistical validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
data = ["yfinance>=0.2"]
rnn = ["torch>=2.2"]
notebooks = ["jupyter", "ipykernel"]
dev = ["pytest>=8", "ruff>=0.5", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# E501: long lines are tolerated in research scripts; E741: l/I names are common in formulae.
ignore = ["E501", "E741", "E731", "E402"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
